        <h1 style="font-size:2rem;font-weight:800;color:#4400a8;margin-bottom:16px">T.E.R.M. Edu — India's #1 Entrepreneurship Learning Management System</h1>
        <p>Welcome to T.E.R.M. Edu (Training in Entrepreneurship, Research &amp; Management), India's leading platform for entrepreneurship education. Our mission is to make high-quality business and startup education accessible to every aspiring entrepreneur across India and beyond.</p>
        <p>T.E.R.M. Edu offers three structured learning plans designed to match your goals and pace. The <strong>Starter Plan</strong> gives you immediate access to self-paced entrepreneurship courses with no entrance test required — perfect if you are just beginning your journey. The <strong>Growth Plan</strong> unlocks live classes with expert mentors alongside a rich library of self-paced content, and requires passing our AI-powered entrance exam called TEET. The <strong>Premium Plan</strong> provides full access to all courses, live sessions, dedicated mentorship, and startup incubation support — the most complete entrepreneurship education experience available on the platform.</p>
        <p>Our unique <strong>TEET (T.E.R.M. Edu Entrance Test)</strong> is an AI-powered examination conducted conversationally by Priya, our AI interviewer. It evaluates your entrepreneurial thinking, business fundamentals, and problem-solving skills — qualifying you for advanced learning plans. The exam is short, fair, and designed to ensure every Growth and Premium learner is ready to make the most of their education.</p>
        <p>Every plan on T.E.R.M. Edu includes expert-led courses, live interactive video sessions, project submissions, AI-powered assessments, and a vibrant community of aspiring entrepreneurs. Our curriculum is built by industry experts and designed specifically around the practical needs of building a real business in India. We believe entrepreneurship is a skill that can be taught, practised, and mastered — and our structured programmes are the proof.</p>
        <p>T.E.R.M. Edu is available as a web platform at <strong>app.termedu.in</strong> and as an Android app. To get started, <a href="/login" style="color:#4400a8">create a free account</a>, explore our <a href="/pricing" style="color:#4400a8">learning plans and pricing</a>, <a href="/about" style="color:#4400a8">learn more about us</a>, or <a href="/contact" style="color:#4400a8">contact our team</a>. You can also review our <a href="/privacy-policy" style="color:#4400a8">Privacy Policy</a> and <a href="/terms" style="color:#4400a8">Terms &amp; Conditions</a>. JavaScript must be enabled to use the full interactive platform.</p>
